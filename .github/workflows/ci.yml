name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      heavy:
        description: "Run the heavy shard (as the nightly does) instead of the pr splits"
        type: boolean
        default: false
  # The heavy fault scenarios (scripts/e2e.py --shard heavy), nightly.
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  # Keep nightly and on-demand runs independent of automatic verification.
  group: ci-${{ github.event_name == 'schedule' && 'nightly-' || github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.ref }}
  # A newer PR revision or main tip supersedes its older automatic run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  # flexvm's own toolchain. Firecracker builds with the one its rust-toolchain.toml pins.
  RUST_TOOLCHAIN: "1.88.0"
  # The e2e image-template case's image (pulled, then cached: see "Restore image").
  E2E_IMAGE: public.ecr.aws/docker/library/busybox:1.36
  # Where the scripts install firecracker, the kernel and the base rootfs (flexvm's default state).
  STATE: /var/lib/flexvm
  # No FC_VERSION / CI_VERSION / KERNEL overrides are set here. fetch.sh --urls resolves
  # them, and the cache keys below are built from its output, so setting one changes the keys.

jobs:
  check:
    # The release build is the e2e job's: it builds the binary that the tests run.
    name: fmt, clippy, unit tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: "Pinned artifacts release" tells how long a release has been pending from it.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --workspace
      # The #[ignore]d tests that need root (taps, routing and tc; root-owned files; the guest's bind
      # mounts), no VM: built as the runner's user, run as root.
      - name: Root unit tests
        run: |
          sudo modprobe tun
          host=$(rustc -vV | sed -n 's/^host: //p')
          # The native QEMU/OCI restore proof requires explicit external artifacts;
          # software-lifecycle.py exercises that real path in the software jobs.
          cargo test -p flexvm -p flexvm-init --config "target.$host.runner=\"sudo -E\"" -- --ignored --skip qemu::tests::real_agent_cold_restore_preserves_process_ram_and_sessions
      - name: Storage CLI clones without virtualization devices
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends strace
          cargo build --locked -p flexvm
          for mode in host scan; do
            mode_args=()
            if [ "$mode" = scan ]; then mode_args=(--scan-fallback); fi
            sudo systemd-run --scope --collect -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/volume-clone.py --bin target/debug/flexvm --output "$RUNNER_TEMP/volume-clone-$mode" "${mode_args[@]}"
          done
      - name: Storage CLI filesystem reflinks without virtualization devices
        if: runner.arch == 'X64'
        run: |
          sudo apt-get install -y -q --no-install-recommends btrfs-progs
          sudo systemd-run --scope --collect -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/volume-clone.py --bin target/debug/flexvm --btrfs --output "$RUNNER_TEMP/volume-clone-btrfs"
      # The semver artifacts release (vMAJOR.MINOR.PATCH; what `cargo build` users download) must be built
      # from this checkout's inputs (scripts/pin-artifacts.sh --inputs): a change to them bumps ARTIFACTS_TAG
      # in the same change, or fails here, PR or main. --check also validates the semver tag format.
      # A bumped tag is pending until it is released and pinned (RELEASING in README.md): a warning,
      # but on main (push, nightly) a failure once it has been pending for the release window.
      - name: Pinned artifacts release
        env:
          REF: ${{ github.ref }}
        run: |
          status=0
          ./scripts/pin-artifacts.sh --check || status=$?
          case $status in
            0) ;;
            3) echo "::warning::the artifacts release is pending: tag, release and pin it (RELEASING in README.md)" ;;
            4)
              if [ "$REF" != refs/heads/main ]; then
                echo "::warning::the artifacts release has been pending for longer than the release window (RELEASING in README.md)"
              else
                echo "::error::the artifacts release has been pending for longer than the release window: tag, release and pin it (RELEASING in README.md)"
                exit 1
              fi
              ;;
            *)
              echo "::error::the artifacts release is stale (built from other inputs than this checkout's) or its pins are broken: bump ARTIFACTS_TAG in scripts/versions.sh (RELEASING in README.md)"
              exit 1
              ;;
          esac
      - name: Failure capture compression
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zstd
      - name: Compatibility harness tests
        run: |
          python3 scripts/compat/test_harness.py
          python3 scripts/compat/test_software.py
          python3 scripts/compat/test_workload_fixture.py
      - name: e2e scheduler self-test
        # Fake templates and workers, one of which cannot be spawned: its cases must fail.
        run: python3 scripts/e2e.py --selftest --log-dir "$RUNNER_TEMP/e2e-selftest"
      - name: release pin tests
        run: |
          python3 scripts/test-artifacts.py
          rustc --edition=2021 --test flexvm/build.rs -o "$RUNNER_TEMP/build-tests"
          "$RUNNER_TEMP/build-tests"
      - name: lab teardown self-test
        # The lab scripts' process matching and cgroup cleanup (scripts/net-common.sh): rootless, no VM.
        run: ./scripts/net-common-test.sh

  # Independent of hardware availability: boot an actual Linux guest through
  # software CPU emulation with /dev/kvm unusable in a private mount namespace.
  software-execution:
    name: software execution without KVM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, qemu: qemu-system-x86, extra: "--guest-kvm --checkpoint" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, qemu: qemu-system-arm, extra: "--guest-kvm --checkpoint" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ${{ matrix.qemu }} strace zstd build-essential flex bison bc libelf-dev libssl-dev dwarves xz-utils kmod pkg-config zlib1g-dev libzstd-dev squashfs-tools
      - name: Cache fixed x86 software CPU engine
        if: matrix.arch == 'x86_64'
        id: software-qemu
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/software-qemu
          key: software-qemu-x86_64-ubuntu24-${{ hashFiles('scripts/build-qemu.sh', 'scripts/patches/qemu-*.patch', 'scripts/compat/parent-kvm/slot-map.h') }}
      - name: Install fixed x86 software CPU engine
        if: matrix.arch == 'x86_64'
        run: |
          if [ ! -x "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" ]; then
            sudo apt-get install -y -q --no-install-recommends ninja-build python3-venv libglib2.0-dev libpixman-1-dev libslirp-dev libseccomp-dev libfdt-dev
            scripts/build-qemu.sh "$RUNNER_TEMP/software-qemu"
          fi
          sudo ln -sf "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" /usr/local/bin/qemu-system-x86_64
          sudo qemu-system-x86_64 --version
      - name: Shared RAM across separate software CPU workers
        if: matrix.arch == 'x86_64'
        run: |
          sudo python3 scripts/compat/software-parent-ram.py --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --output "$RUNNER_TEMP/software-parent-ram"
          cat "$RUNNER_TEMP/software-parent-ram/report.json"
      - name: Software state directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" "$RUNNER_TEMP/software-state/artifacts"
      - name: Cache kernel
        id: software-kernel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/software-state/artifacts
          key: software-kernel-${{ matrix.arch }}-${{ hashFiles('scripts/build-kernel.sh', 'scripts/package-kernel-modules.sh', 'scripts/fetch.sh', 'scripts/versions.sh', 'scripts/checksums.sha256', 'kernel/config/*', 'kernel/features*.config', 'kernel/source.env', 'kernel/patches/*', 'scripts/apply-kernel-patches.sh') }}
      - name: Fetch or build the reviewed kernel
        run: ./scripts/fetch.sh --kernel --state "$RUNNER_TEMP/software-state"
      - name: Fetch the unchanged hypervisor
        run: ./scripts/fetch.sh --state "$RUNNER_TEMP/software-state"
      - name: Boot with KVM masked
        run: |
          sudo python3 scripts/compat/software-boot.py --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --output "$RUNNER_TEMP/software-boot" ${{ matrix.extra }} --guest-firecracker "$RUNNER_TEMP/software-state/artifacts/firecracker"
          cat "$RUNNER_TEMP/software-boot/report.json"
      - name: TSC initialization without hardware scaling
        if: matrix.arch == 'x86_64'
        run: sudo python3 scripts/compat/software-boot.py --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --output "$RUNNER_TEMP/software-tsc" --guest-kvm --guest-tsc
      - name: Save software kernel
        if: success() && steps.software-kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/software-state/artifacts
          key: ${{ steps.software-kernel.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache userspace vsock tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/software-vsock
          key: software-vsock-0.3.0-${{ matrix.arch }}-ubuntu24-rust188
      - name: Build software execution tools
        run: |
          if [ ! -x "$RUNNER_TEMP/software-vsock/bin/vhost-device-vsock" ]; then
            cargo install vhost-device-vsock --version 0.3.0 --locked --root "$RUNNER_TEMP/software-vsock" --target-dir "$RUNNER_TEMP/vsock-build"
          fi
          cargo build --release -p flexvm
      - name: Real OCI image and guest agent without host virtualization devices
        run: |
          sudo python3 scripts/compat/software-agent.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --vsock-backend "$RUNNER_TEMP/software-vsock/bin/vhost-device-vsock" --output "$RUNNER_TEMP/software-agent" --docker --timeout 600
          cat "$RUNNER_TEMP/software-agent/report.json"
      - name: Serial control with real containers and no virtualization devices
        run: |
          sudo python3 scripts/compat/software-agent.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --control serial --output "$RUNNER_TEMP/software-serial" --docker --timeout 600
          cat "$RUNNER_TEMP/software-serial/report.json"
      - name: Named software VM ownership without virtualization devices
        run: |
          sudo python3 scripts/compat/software-owner.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --output "$RUNNER_TEMP/software-owner" --timeout 300 --pause-cycles 32
          cat "$RUNNER_TEMP/software-owner/report.json"
          sudo python3 scripts/compat/software-lifecycle.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --output "$RUNNER_TEMP/software-lifecycle" --timeout 600
          cat "$RUNNER_TEMP/software-lifecycle/report.json"
      - name: Distro PID 1 and fresh-owner restore without virtualization devices
        run: |
          sudo python3 scripts/test-image.py --state "$RUNNER_TEMP/software-state" "$RUNNER_TEMP/software-systemd-image"
          sudo systemd-run --scope --collect -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/software-workload.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --image "$RUNNER_TEMP/software-systemd-image" --workload scripts/compat/workloads/distro-systemd.sh --boot systemd --mem 1536 --timeout 900 --require storage.fuse --output "$RUNNER_TEMP/software-distro"
          cat "$RUNNER_TEMP/software-distro/report.json"
      - name: Delegated user services without virtualization devices
        run: |
          sudo systemd-run --scope --collect -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/software-workload.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --image "$RUNNER_TEMP/software-systemd-image" --workload scripts/compat/workloads/user-sessions.sh --boot systemd --mem 2048 --timeout 900 --require storage.fuse --output "$RUNNER_TEMP/software-user-sessions"
          cat "$RUNNER_TEMP/software-user-sessions/report.json"
      - name: Restore pinned Alpine base for OpenRC
        id: openrc-alpine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openrc-alpine-oci
          key: openrc-alpine-v1-${{ runner.arch }}-${{ hashFiles('scripts/compat/workload-fixture.py') }}
      - name: Verify pinned Alpine base for OpenRC
        run: |
          if [[ ! -d "$RUNNER_TEMP/openrc-alpine-oci" ]] && ! command -v skopeo >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends skopeo
          fi
          python3 scripts/compat/workload-fixture.py --alpine --cache "$RUNNER_TEMP/openrc-alpine-oci"
      - name: Save verified Alpine base for OpenRC
        if: steps.openrc-alpine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openrc-alpine-oci
          key: ${{ steps.openrc-alpine-cache.outputs.cache-primary-key }}
      - name: OpenRC PID 1 and fresh-owner restore without virtualization devices
        run: |
          sudo systemd-run --scope --collect -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/openrc-image.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --alpine-layout "$RUNNER_TEMP/openrc-alpine-oci" --output "$RUNNER_TEMP/software-openrc-image"
          sudo systemd-run --scope --collect -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/software-workload.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --image "$RUNNER_TEMP/software-openrc-image" --workload scripts/compat/workloads/distro-openrc.sh --boot openrc --mem 1536 --timeout 900 --require storage.fuse --output "$RUNNER_TEMP/software-openrc"
          cat "$RUNNER_TEMP/software-openrc/report.json"
      - name: Unchanged KVM clients inside software FlexVM
        run: |
          sudo python3 scripts/compat/software-kvm.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --firecracker "$RUNNER_TEMP/software-state/artifacts/firecracker" --output "$RUNNER_TEMP/software-kvm"
          cat "$RUNNER_TEMP/software-kvm/report.json"
      - name: Live nested Linux through ordinary software stop/start
        run: |
          sudo python3 scripts/compat/software-lifecycle.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --firecracker "$RUNNER_TEMP/software-state/artifacts/firecracker" --output "$RUNNER_TEMP/software-nested-lifecycle" --timeout 900
          cat "$RUNNER_TEMP/software-nested-lifecycle/report.json"

  software-modules:
    name: guest kernel modules without KVM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, qemu: qemu-system-x86 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, qemu: qemu-system-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ${{ matrix.qemu }} strace build-essential flex bison bc libelf-dev libssl-dev dwarves xz-utils kmod pkg-config zlib1g-dev libzstd-dev
      - name: Cache fixed x86 software CPU engine
        if: matrix.arch == 'x86_64'
        id: software-qemu
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/software-qemu
          key: software-qemu-x86_64-ubuntu24-${{ hashFiles('scripts/build-qemu.sh', 'scripts/patches/qemu-*.patch', 'scripts/compat/parent-kvm/slot-map.h') }}
      - name: Install fixed x86 software CPU engine
        if: matrix.arch == 'x86_64'
        run: |
          if [ ! -x "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" ]; then
            sudo apt-get install -y -q --no-install-recommends ninja-build python3-venv libglib2.0-dev libpixman-1-dev libslirp-dev libseccomp-dev libfdt-dev
            scripts/build-qemu.sh "$RUNNER_TEMP/software-qemu"
          fi
          sudo ln -sf "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" /usr/local/bin/qemu-system-x86_64
          sudo qemu-system-x86_64 --version
      - name: Kernel artifact directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" "$RUNNER_TEMP/software-state/artifacts"
      - name: Matching kernel and development bundles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/software-state/artifacts
          key: module-artifacts-${{ matrix.arch }}-${{ hashFiles('scripts/build-kernel.sh', 'scripts/package-kernel-modules.sh', 'scripts/fetch.sh', 'scripts/versions.sh', 'scripts/checksums.sha256', 'kernel/config/*', 'kernel/features*.config', 'kernel/source.env', 'kernel/patches/*', 'scripts/apply-kernel-patches.sh') }}
      - name: Fetch matching kernel, runtime modules and SDK
        run: scripts/fetch.sh --kernel-sdk --state "$RUNNER_TEMP/software-state"
      - name: Parent TCG worker through the guest KVM API
        if: matrix.arch == 'x86_64'
        run: |
          sdk=$(mktemp -d "$RUNNER_TEMP/parent-kvm-sdk.XXXXXXXX")
          trap 'rm -rf "$sdk"' EXIT
          artifacts="$RUNNER_TEMP/software-state/artifacts"
          tar --extract --gzip --no-same-owner --file="$artifacts/kernel-sdk.tar.gz" --directory="$sdk"
          release=$(jq -er '.release' "$sdk/usr/lib/flexvm/kernel-modules.json")
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-run"
          cat "$RUNNER_TEMP/parent-kvm-run/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-scattered" --ram-pages 64
          cat "$RUNNER_TEMP/parent-kvm-scattered/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-protected" --ram-pages 49152 --protected-entry
          cat "$RUNNER_TEMP/parent-kvm-protected/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-split" --ram-pages 49152 --protected-entry --split-slot
          cat "$RUNNER_TEMP/parent-kvm-split/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-cancel" --ram-pages 64 --protected-entry --split-slot --interrupt-run
          cat "$RUNNER_TEMP/parent-kvm-cancel/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-smp" --ram-pages 64 --protected-entry --split-slot --two-vcpus --cpuid
          cat "$RUNNER_TEMP/parent-kvm-smp/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-long" --ram-pages 64 --split-slot --long-mode --fpu
          cat "$RUNNER_TEMP/parent-kvm-long/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-msrs" --ram-pages 64 --split-slot --long-mode --msrs
          cat "$RUNNER_TEMP/parent-kvm-msrs/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-mmio" --ram-pages 64 --split-slot --long-mode --mmio-read --ioeventfd --complete-read
          cat "$RUNNER_TEMP/parent-kvm-mmio/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-irqchip" --ram-pages 64 --split-slot --protected-entry --pit --tss --lapic --pio --complete-read
          cat "$RUNNER_TEMP/parent-kvm-irqchip/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-irqfd" --ram-pages 64 --split-slot --protected-entry --irqfd
          cat "$RUNNER_TEMP/parent-kvm-irqfd/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-zero-slot" --ram-pages 32768 --protected-entry --zero-slot
          cat "$RUNNER_TEMP/parent-kvm-zero-slot/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-single-page" --ram-pages 1
          cat "$RUNNER_TEMP/parent-kvm-single-page/report.json"
          sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
            --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
            --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-reject-close" --reject-close
          cat "$RUNNER_TEMP/parent-kvm-reject-close/report.json"
          if sudo python3 -c 'import fcntl, os; fd = os.open("/dev/kvm", os.O_RDWR); assert fcntl.ioctl(fd, 0xAE00) == 12; fcntl.ioctl(fd, 0xAE01, 0)' 2>/dev/null; then
            sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
              --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
              --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-native-worker" --parent-engine kvm --native-oracle --ram-pages 64
            cat "$RUNNER_TEMP/parent-kvm-native-worker/report.json"
            sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
              --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
              --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-native-protected" --parent-engine kvm --native-oracle --ram-pages 49152 --protected-entry --split-slot
            cat "$RUNNER_TEMP/parent-kvm-native-protected/report.json"
            sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
              --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
              --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-native-cancel" --parent-engine kvm --native-oracle --ram-pages 64 --protected-entry --split-slot --interrupt-run
            cat "$RUNNER_TEMP/parent-kvm-native-cancel/report.json"
            sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
              --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
              --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-native-smp" --parent-engine kvm --native-oracle --ram-pages 64 --protected-entry --split-slot --two-vcpus --cpuid
            cat "$RUNNER_TEMP/parent-kvm-native-smp/report.json"
            sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
              --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
              --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-native-long" --parent-engine kvm --native-oracle --ram-pages 64 --split-slot --long-mode --fpu
            cat "$RUNNER_TEMP/parent-kvm-native-long/report.json"
            sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
              --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
              --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-native-msrs" --parent-engine kvm --native-oracle --ram-pages 64 --split-slot --long-mode --msrs
            cat "$RUNNER_TEMP/parent-kvm-native-msrs/report.json"
            sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
              --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
              --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-native-mmio" --parent-engine kvm --native-oracle --ram-pages 64 --split-slot --long-mode --mmio-read --ioeventfd --complete-read
            cat "$RUNNER_TEMP/parent-kvm-native-mmio/report.json"
            sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
              --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
              --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-native-irqchip" --parent-engine kvm --native-oracle --ram-pages 64 --split-slot --protected-entry --pit --tss --lapic --pio --complete-read
            cat "$RUNNER_TEMP/parent-kvm-native-irqchip/report.json"
            sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
              --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
              --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-native-irqfd" --parent-engine kvm --native-oracle --ram-pages 64 --split-slot --protected-entry --irqfd
            cat "$RUNNER_TEMP/parent-kvm-native-irqfd/report.json"
            sudo systemd-run --scope --collect -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/parent-kvm-run.py \
              --qemu "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" --kernel "$artifacts/vmlinux" \
              --kernel-build "$sdk/lib/modules/$release/build" --output "$RUNNER_TEMP/parent-kvm-native-zero-slot" --parent-engine kvm --native-oracle --ram-pages 32768 --protected-entry --zero-slot
            cat "$RUNNER_TEMP/parent-kvm-native-zero-slot/report.json"
          fi
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build FlexVM
        run: cargo build --release -p flexvm
      - name: Guest compile, DKMS, ABI rejection and loaded module lifecycle
        run: |
          sudo systemd-run --scope --collect -p MemoryMax=4G -p MemorySwapMax=0 -p CPUQuota=200% python3 scripts/compat/software-modules.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --output "$RUNNER_TEMP/software-modules" --timeout 1800
          cat "$RUNNER_TEMP/software-modules/report.json"

  # A pull request into main runs one workload of each kind, on x86_64: a container runtime under flexvm-init
  # (podman), a rootless one under systemd (rootless-containerd), a container manager (nspawn) and
  # Kubernetes (k3s). Every workload on both architectures (22 jobs, most of a run's runner time) runs
  # on main, nightly, and on request for a branch: gh workflow run ci.yml --ref <branch>.
  # Stacked PRs still run formatting, unit tests, software execution and guest modules on both architectures.
  software-workloads:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    name: guest workload without KVM (${{ matrix.arch }}, ${{ matrix.workload }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (matrix.workload == 'k3s' || matrix.workload == 'kind') && 80 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["x86_64"]' || '["x86_64", "aarch64"]') }}
        workload: ${{ fromJSON(github.event_name == 'pull_request' && '["podman", "rootless-containerd", "nspawn", "k3s"]' || '["podman", "namespace-sandboxes", "containerd", "rootless-docker", "rootless-containerd", "rootless-podman", "nspawn", "lxc", "k3s", "kind", "incus"]') }}
    env:
      QEMU_PACKAGE: ${{ matrix.arch == 'aarch64' && 'qemu-system-arm' || 'qemu-system-x86' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends "$QEMU_PACKAGE" strace build-essential flex bison bc libelf-dev libssl-dev dwarves xz-utils kmod pkg-config zlib1g-dev libzstd-dev squashfs-tools
      - name: Cache fixed x86 software CPU engine
        if: matrix.arch == 'x86_64'
        id: software-qemu
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/software-qemu
          key: software-qemu-x86_64-ubuntu24-${{ hashFiles('scripts/build-qemu.sh', 'scripts/patches/qemu-*.patch', 'scripts/compat/parent-kvm/slot-map.h') }}
      - name: Install fixed x86 software CPU engine
        if: matrix.arch == 'x86_64'
        run: |
          if [ ! -x "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" ]; then
            sudo apt-get install -y -q --no-install-recommends ninja-build python3-venv libglib2.0-dev libpixman-1-dev libslirp-dev libseccomp-dev libfdt-dev
            scripts/build-qemu.sh "$RUNNER_TEMP/software-qemu"
          fi
          sudo ln -sf "$RUNNER_TEMP/software-qemu/bin/qemu-system-x86_64" /usr/local/bin/qemu-system-x86_64
          sudo qemu-system-x86_64 --version
      - name: Kernel artifact directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" "$RUNNER_TEMP/software-state/artifacts"
      - name: Matching kernel runtime artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/software-state/artifacts
          key: workload-artifacts-${{ matrix.arch }}-${{ hashFiles('scripts/build-kernel.sh', 'scripts/package-kernel-modules.sh', 'scripts/fetch.sh', 'scripts/versions.sh', 'scripts/checksums.sha256', 'kernel/config/*', 'kernel/features*.config', 'kernel/source.env', 'kernel/patches/*', 'scripts/apply-kernel-patches.sh') }}
      - name: Fetch matching kernel and runtime modules
        run: scripts/fetch.sh --kernel --state "$RUNNER_TEMP/software-state"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build FlexVM
        run: cargo build --release -p flexvm
      - name: Prepare the systemd image for distro workloads
        if: startsWith(matrix.workload, 'rootless-') || matrix.workload == 'nspawn' || matrix.workload == 'lxc' || matrix.workload == 'k3s' || matrix.workload == 'kind' || matrix.workload == 'incus'
        run: |
          scripts/fetch.sh --state "$RUNNER_TEMP/software-state"
          sudo python3 scripts/test-image.py --state "$RUNNER_TEMP/software-state" "$RUNNER_TEMP/software-distro-image"
      - name: Restore immutable workload fixture
        if: matrix.workload == 'kind' || matrix.workload == 'k3s' || matrix.workload == 'rootless-containerd'
        id: workload-fixture-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/workload-fixture-cache
          key: busybox-fixture-v1-${{ runner.arch }}-${{ hashFiles('scripts/compat/workload-fixture.py') }}
      - name: Verify and export immutable workload fixture
        if: matrix.workload == 'kind' || matrix.workload == 'k3s' || matrix.workload == 'rootless-containerd'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends skopeo
          python3 scripts/compat/workload-fixture.py --cache "$RUNNER_TEMP/workload-fixture-cache/oci" --output "$RUNNER_TEMP/workload-fixture"
      - name: Save verified workload fixture
        if: (matrix.workload == 'kind' || matrix.workload == 'k3s' || matrix.workload == 'rootless-containerd') && steps.workload-fixture-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/workload-fixture-cache
          key: ${{ steps.workload-fixture-cache.outputs.cache-primary-key }}
      - name: Restore pinned Ubuntu workload image
        if: matrix.workload == 'podman' || matrix.workload == 'namespace-sandboxes' || matrix.workload == 'containerd'
        id: ubuntu-workload-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ubuntu-workload-oci
          key: ubuntu-workload-v1-${{ runner.arch }}-${{ hashFiles('scripts/compat/workload-fixture.py') }}
      - name: Verify pinned Ubuntu workload image
        if: matrix.workload == 'podman' || matrix.workload == 'namespace-sandboxes' || matrix.workload == 'containerd'
        run: |
          if [[ ! -d "$RUNNER_TEMP/ubuntu-workload-oci" ]] && ! command -v skopeo >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends skopeo
          fi
          python3 scripts/compat/workload-fixture.py --ubuntu --cache "$RUNNER_TEMP/ubuntu-workload-oci"
      - name: Save verified Ubuntu workload image
        if: (matrix.workload == 'podman' || matrix.workload == 'namespace-sandboxes' || matrix.workload == 'containerd') && steps.ubuntu-workload-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ubuntu-workload-oci
          key: ${{ steps.ubuntu-workload-cache.outputs.cache-primary-key }}
      - name: Guest workload and fresh-owner software restoration
        run: |
          workload_args=(--image "$RUNNER_TEMP/ubuntu-workload-oci")
          memory_limit=6G
          cpu_quota=200%
          workload_timeout=1800
          if [[ "${{ matrix.workload }}" == rootless-* || "${{ matrix.workload }}" == nspawn || "${{ matrix.workload }}" == lxc || "${{ matrix.workload }}" == k3s || "${{ matrix.workload }}" == kind || "${{ matrix.workload }}" == incus ]]; then
            workload_args=(--boot systemd --image "$RUNNER_TEMP/software-distro-image")
          fi
          if [[ "${{ matrix.workload }}" == k3s || "${{ matrix.workload }}" == kind ]]; then
            workload_memory=4096
            if [[ "${{ matrix.workload }}" == kind ]]; then
              workload_memory=6144
              memory_limit=10G
            fi
            workload_args+=(--mem "$workload_memory" --vcpus 4 --poweroff-timeout 180)
            cpu_quota=400%
            workload_timeout=3600
          fi
          if [[ "${{ matrix.workload }}" == incus ]]; then
            workload_args+=(--mem 3072 --poweroff-timeout 180)
          fi
          if [[ "${{ matrix.workload }}" == kind || "${{ matrix.workload }}" == k3s || "${{ matrix.workload }}" == rootless-containerd ]]; then
            for name in busybox.tar busybox.json; do
              workload_args+=(--seed "$RUNNER_TEMP/workload-fixture/$name" "/nested-input/$name")
            done
            workload_args+=(--seed scripts/compat/verify-fixture-import.py /nested-input/verify-fixture-import.py)
          fi
          if [[ "${{ matrix.workload }}" == rootless-containerd ]]; then
            layout="$RUNNER_TEMP/workload-fixture-cache/oci"
            for path in "$layout"/{oci-layout,index.json,upstream-index.json,blobs/sha256/*}; do
              workload_args+=(--seed "$path" "/nested-input/busybox-oci/${path#"$layout"/}")
            done
            workload_args+=(--seed scripts/compat/workload-fixture.py /nested-input/workload-fixture.py)
          fi
          sudo systemd-run --scope --collect -p "MemoryMax=$memory_limit" -p MemorySwapMax=0 -p "CPUQuota=$cpu_quota" python3 scripts/compat/software-workload.py --bin target/release/flexvm --kernel "$RUNNER_TEMP/software-state/artifacts/vmlinux" --workload "scripts/compat/workloads/${{ matrix.workload }}.sh" "${workload_args[@]}" --require storage.fuse --output "$RUNNER_TEMP/software-workload" --timeout "$workload_timeout"
          cat "$RUNNER_TEMP/software-workload/report.json"

  e2e:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    # Shards (scripts/e2e.py --shard): pr (the cases, and the main and recovery scenarios) in four
    # splits side by side, balanced by e2e.py's COST; the scheduled run takes heavy (GiB-scale
    # guests, long windows) one scenario at a time.
    # The steps are e2e-aarch64's too: KVM (in env) says whether this job runs VMs; e2e-aarch64 leaves
    # it unset, and "Probe KVM" sets it.
    name: end-to-end (KVM, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.shard == 'heavy' && 150 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || inputs.heavy) && '["heavy"]' || '["pr 1/4", "pr 2/4", "pr 3/4", "pr 4/4"]') }}
    env:
      KVM: "true"
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Whether the runner can run VMs, where the job does not say (e2e-aarch64): it decides what the job
      # runs (the pr shard on KVM, or what needs no KVM). Never fails; it reports. A step, not a job of
      # its own that e2e-aarch64 needs: that job waited in the queue twice, once behind the probe.
      - name: Probe KVM
        if: env.KVM == ''
        run: |
          uname -r; nproc; free -m; getconf PAGESIZE
          grep -m1 -E 'CPU part|Features' /proc/cpuinfo || true
          grep -E 'HAVE_ARCH_USERFAULTFD_WP|USERFAULTFD' "/boot/config-$(uname -r)" || true
          kvm=false
          if [ -e /dev/kvm ]; then
            # As scripts/e2e.py decides (kvm_unusable): KVM_GET_API_VERSION answers 12, and KVM_CREATE_VM works.
            sudo chmod 0666 /dev/kvm
            python3 -c 'import fcntl, os; fd = os.open("/dev/kvm", os.O_RDWR); v = fcntl.ioctl(fd, 0xAE00); vm = fcntl.ioctl(fd, 0xAE01, 0); print("KVM API", v, "vm fd", vm); assert v == 12' \
              && kvm=true && echo "::warning::this runner has KVM: the pr shard runs here unsplit, and heavy never; split e2e-aarch64 as e2e is" \
              || echo "::warning::this runner has /dev/kvm but KVM_CREATE_VM fails"
          else
            echo "::notice::this runner has no /dev/kvm: end-to-end runs only what needs no KVM"
          fi
          echo "KVM=$kvm" >> "$GITHUB_ENV"

      - name: Enable KVM
        if: env.KVM == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          # Hardware virtualization (x86 names it in the CPU flags; on aarch64 KVM_CREATE_VM below tells).
          if [ "$(uname -m)" = x86_64 ]; then grep -m1 -o -E 'vmx|svm' /proc/cpuinfo; fi
          # KVM_GET_API_VERSION must answer 12, and KVM_CREATE_VM must work.
          python3 -c 'import fcntl, os; fd = os.open("/dev/kvm", os.O_RDWR); v = fcntl.ioctl(fd, 0xAE00); vm = fcntl.ioctl(fd, 0xAE01, 0); print("KVM API", v, "vm fd", vm); assert v == 12'
          nproc; free -m; uname -r

      - name: KVM ABI reference execution
        if: runner.arch == 'X64' && (matrix.shard == 'pr 1/4' || matrix.shard == 'heavy')
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -static -pthread scripts/compat/kvm-abi.c -o "$RUNNER_TEMP/kvm-abi"
          "$RUNNER_TEMP/kvm-abi"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
          cache-on-failure: true

      # flexvm builds in the background (its release profile: fat LTO, one codegen unit,
      # as shipped) while the steps below restore or build the rest; "Build flexvm" waits.
      - name: Start building flexvm
        run: |
          nohup sh -c 'cargo build --release -p flexvm; echo $? > "$RUNNER_TEMP/build.status"' > "$RUNNER_TEMP/build.log" 2>&1 &

      # The caches below restore into it as the runner's user.
      - name: State directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" "$STATE/artifacts" /var/lib/flexvm-test-image

      # Cache keys: the build inputs in the repo, what fetch.sh resolves (versions and
      # URLs, plus the ETags of the unversioned S3 objects), and the build environment
      # (runner image; Firecracker's toolchain is
      # pinned by its commit, FC_COMMIT in scripts/versions.sh, part of the Firecracker cache key).
      - name: Cache keys
        id: keys
        run: |
          ./scripts/fetch.sh --urls > urls.txt
          for f in vmlinux base.squashfs; do
            url=$(awk -v f="$f" '$1 == f {print $2}' urls.txt)
            # A flexvm release's assets never change (and are pinned): no ETag needed.
            case $url in https://github.com/*/releases/download/*|build:*) continue ;; esac
            etag=$(curl -sfI "$url" | tr -d '\r' | awk 'tolower($1) == "etag:" {print $2}')
            test -n "$etag"
            echo "$f-etag $etag" >> urls.txt
          done
          cat urls.txt
          echo "env=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "fc=$(grep '^firecracker ' urls.txt | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          # Until the release is pinned, fetch.sh names the stock Firecracker (a .tgz): the patched one is built here.
          if grep -q '^firecracker .*\.tgz$' urls.txt; then echo "fc-build=true" >> "$GITHUB_OUTPUT"; fi
          echo "downloads=$(sha256sum urls.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
          rm urls.txt

      # Patched Firecracker, built from this checkout's patches while its ARTIFACTS_TAG is unpinned (a change
      # to them bumps it, so a patch under review is never in the pinned release): rebuilt only when its
      # inputs change. Each artifact is saved right after it is built, so a failing test run still fills the
      # cache. Once the release is pinned, flexvm runs only its Firecracker, which fetch.sh downloads instead.
      - name: Restore Firecracker
        id: fc-cache
        if: steps.keys.outputs.fc-build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STATE }}/artifacts/firecracker
            ${{ env.STATE }}/artifacts/firecracker.sha256
          key: firecracker-s5-tests-v1-${{ steps.keys.outputs.env }}-${{ steps.keys.outputs.fc }}-${{ hashFiles('firecracker/*.patch', 'scripts/build-firecracker.sh', 'scripts/versions.sh') }}
      - name: Build Firecracker
        if: steps.keys.outputs.fc-build == 'true' && steps.fc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools libseccomp-dev
          ./scripts/build-firecracker.sh
          # For this runner's arch (x86_64, or aarch64-unknown-linux-musl on the arm runner).
          file "$STATE/artifacts/firecracker" | grep -q "$([ "$(uname -m)" = aarch64 ] && echo 'ARM aarch64' || echo 'x86-64')"
      - name: Firecracker power-off, stable disk serial and confinement tests
        if: runner.arch == 'X64' && steps.keys.outputs.fc-build == 'true' && steps.fc-cache.outputs.cache-hit != 'true'
        run: |
          export CFLAGS_x86_64_unknown_linux_musl="-idirafter $PWD/build/musl-kheaders"
          cd build/firecracker-src
          cargo test --locked --target x86_64-unknown-linux-musl -p vmm --lib acpi_power
          cargo test --locked --target x86_64-unknown-linux-musl -p vmm --lib acpi::x86_64::tests
          cargo test --locked --release --target x86_64-unknown-linux-musl -p vmm --lib configured_serial_survives_backing_update_and_restore
          cargo test --locked --release --target x86_64-unknown-linux-musl -p vmm --lib invalid_serial_is_rejected_before_opening_the_backing_file
          # Confinement fixtures create TAP devices: build as the runner, run as root.
          cargo test --locked --release --target x86_64-unknown-linux-musl -p vmm --lib --no-run --message-format=json > "$RUNNER_TEMP/firecracker-unit-tests.json"
          python3 - "$RUNNER_TEMP/firecracker-unit-tests.json" <<'PY'
          import json, subprocess, sys
          artifacts = [json.loads(line) for line in open(sys.argv[1])]
          binaries = [item['executable'] for item in artifacts if item.get('reason') == 'compiler-artifact'
                      and item.get('target', {}).get('name') == 'vmm' and item.get('executable')]
          assert len(binaries) == 1, binaries
          subprocess.run(['sudo', binaries[0], 'persist::tests::test_check_', '--test-threads=1'], check=True)
          PY

      - name: Save Firecracker
        if: steps.keys.outputs.fc-build == 'true' && steps.fc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STATE }}/artifacts/firecracker
            ${{ env.STATE }}/artifacts/firecracker.sha256
          key: ${{ steps.fc-cache.outputs.cache-primary-key }}

      # Guest kernel and the test image's base root filesystem (fetch.sh keeps the patched Firecracker built above, its
      # record checking, over the stock one; once the release is pinned, it downloads the release's).
      - name: Restore downloads
        id: dl-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STATE }}/artifacts/vmlinux
            ${{ env.STATE }}/artifacts/vmlinux.sha256
            ${{ env.STATE }}/artifacts/kernel-modules.tar.gz
            ${{ env.STATE }}/artifacts/kernel-modules.tar.gz.sha256
            ${{ env.STATE }}/artifacts/kernel-sdk.tar.gz
            ${{ env.STATE }}/artifacts/kernel-sdk.tar.gz.sha256
            ${{ env.STATE }}/artifacts/base.squashfs
          key: downloads-${{ steps.keys.outputs.downloads }}-${{ hashFiles('scripts/build-kernel.sh', 'scripts/package-kernel-modules.sh', 'scripts/fetch.sh', 'scripts/versions.sh', 'scripts/checksums.sha256') }}
      - name: Fetch kernel and base rootfs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential dwarves
          if ./scripts/fetch.sh --urls | grep -q '^vmlinux build:'; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends build-essential flex bison bc libelf-dev libssl-dev dwarves xz-utils kmod pkg-config zlib1g-dev libzstd-dev
          fi
          ./scripts/fetch.sh
          ./scripts/fetch.sh --kernel-sdk
          echo "base=$(sha256sum "$STATE/artifacts/base.squashfs" | cut -c1-16)" >> "$GITHUB_OUTPUT"
        id: fetch
      - name: Save downloads
        if: steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STATE }}/artifacts/vmlinux
            ${{ env.STATE }}/artifacts/vmlinux.sha256
            ${{ env.STATE }}/artifacts/kernel-modules.tar.gz
            ${{ env.STATE }}/artifacts/kernel-modules.tar.gz.sha256
            ${{ env.STATE }}/artifacts/kernel-sdk.tar.gz
            ${{ env.STATE }}/artifacts/kernel-sdk.tar.gz.sha256
            ${{ env.STATE }}/artifacts/base.squashfs
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      - name: Native cold block boot and host flush
        if: env.KVM == 'true' && (matrix.shard == 'pr 1/4' || matrix.shard == 'heavy')
        run: |
          sudo apt-get install -y -q --no-install-recommends strace
          for boot in first second; do
            sudo python3 scripts/compat/native-block-boot.py --firecracker "$STATE/artifacts/firecracker" --kernel "$STATE/artifacts/vmlinux" --serial fv0123456789abcdef01 --output "$RUNNER_TEMP/native-block-$boot"
          done

      # The test image (scripts/test-image.py: the base root filesystem as an OCI layout), which
      # e2e.py pulls its templates from; it makes it when the cache has none. flexvm embeds flexvm-init.
      - name: Restore test image
        id: test-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/flexvm-test-image
          key: test-image-base${{ steps.fetch.outputs.base }}-${{ hashFiles('scripts/test-image.py') }}
      - name: Own test image
        run: sudo chown -R root:root /var/lib/flexvm-test-image
      - name: squashfs-tools
        if: steps.test-image-cache.outputs.cache-hit != 'true'
        run: command -v unsquashfs > /dev/null || { sudo apt-get update -q; sudo apt-get install -y -q --no-install-recommends squashfs-tools; }

      # Without KVM no template is pulled from the test image, so e2e.py makes none: it is made here, and
      # its image checked to be for this arch.
      - name: Make test image (no KVM)
        if: env.KVM != 'true'
        run: |
          sudo python3 scripts/test-image.py --state "$STATE" /var/lib/flexvm-test-image
          sudo python3 -c '
          import json, os, sys
          d = sys.argv[1]
          blob = lambda digest: json.load(open(os.path.join(d, "blobs", *digest.split(":"))))
          config = blob(blob(json.load(open(os.path.join(d, "index.json")))["manifests"][0]["digest"])["config"]["digest"])
          want = {"x86_64": "amd64", "aarch64": "arm64"}[os.uname().machine]
          print("test image:", config["os"], config["architecture"])
          assert (config["os"], config["architecture"]) == ("linux", want), config
          ' /var/lib/flexvm-test-image

      - name: Build flexvm
        run: |
          while [ ! -e "$RUNNER_TEMP/build.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/build.log"
          exit "$(cat "$RUNNER_TEMP/build.status")"

      # The image case's pull, kept as an OCI layout (scripts/e2e.py --image-cache): restored,
      # the case builds from it without the registry (flexvm still checks every digest). Saved
      # under the image's digest; the month in the key makes a real registry pull at least
      # monthly, and on any cold cache.
      - name: Image cache key
        if: env.KVM == 'true'
        id: img
        run: echo "prefix=image-$(uname -m)-$(echo "$E2E_IMAGE" | tr -c 'A-Za-z0-9.\n-' _)-$(date -u +%Y%m)-" >> "$GITHUB_OUTPUT"
      - name: Restore image
        if: env.KVM == 'true'
        id: img-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache/oci
          key: ${{ steps.img.outputs.prefix }}
          restore-keys: ${{ steps.img.outputs.prefix }}

      # A scenario that finds the runner lacks what it tests (cgroup v2, THP, IPv6, a template's room)
      # is a SKIP, which fails every shard (--no-skips). A KVM job fails if KVM is unusable after all
      # (--require-kvm); one without runs only what needs no KVM (--no-kvm: what is not tagged @needs_kvm).
      - name: Restore immutable workload fixture
        if: env.KVM == 'true'
        id: workload-fixture-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/workload-fixture-cache
          key: busybox-fixture-v1-${{ runner.arch }}-${{ hashFiles('scripts/compat/workload-fixture.py') }}
      - name: Verify and export immutable workload fixture
        if: env.KVM == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends skopeo tcpdump
          python3 scripts/compat/workload-fixture.py --cache "$RUNNER_TEMP/workload-fixture-cache/oci" --output "$RUNNER_TEMP/workload-fixture"
      - name: Save verified workload fixture
        if: env.KVM == 'true' && steps.workload-fixture-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/workload-fixture-cache
          key: ${{ steps.workload-fixture-cache.outputs.cache-primary-key }}
      - name: Restore pinned Ubuntu workload image
        if: env.KVM == 'true'
        id: ubuntu-workload-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ubuntu-workload-oci
          key: ubuntu-workload-v1-${{ runner.arch }}-${{ hashFiles('scripts/compat/workload-fixture.py') }}
      - name: Verify pinned Ubuntu workload image
        if: env.KVM == 'true'
        run: |
          if [[ ! -d "$RUNNER_TEMP/ubuntu-workload-oci" ]] && ! command -v skopeo >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends skopeo
          fi
          python3 scripts/compat/workload-fixture.py --ubuntu --cache "$RUNNER_TEMP/ubuntu-workload-oci"
      - name: Save verified Ubuntu workload image
        if: (env.KVM == 'true') && steps.ubuntu-workload-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ubuntu-workload-oci
          key: ${{ steps.ubuntu-workload-cache.outputs.cache-primary-key }}
      - name: Restore pinned Alpine base for OpenRC
        if: env.KVM == 'true'
        id: openrc-alpine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openrc-alpine-oci
          key: openrc-alpine-v1-${{ runner.arch }}-${{ hashFiles('scripts/compat/workload-fixture.py') }}
      - name: Verify pinned Alpine base for OpenRC
        if: env.KVM == 'true'
        run: python3 scripts/compat/workload-fixture.py --alpine --cache "$RUNNER_TEMP/openrc-alpine-oci"
      - name: Save verified Alpine base for OpenRC
        if: env.KVM == 'true' && steps.openrc-alpine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openrc-alpine-oci
          key: ${{ steps.openrc-alpine-cache.outputs.cache-primary-key }}
      - name: End-to-end tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # "pr 2/4": shard pr, its second of four splits.
          set -- $SHARD
          jobs=4; if [ "$1" = heavy ]; then jobs=1; fi
          kvm=--require-kvm; if [ "$KVM" != true ]; then kvm=--no-kvm; fi
          sudo env FLEXVM_WORKLOAD_FIXTURE="$RUNNER_TEMP/workload-fixture" FLEXVM_COMPAT_APP_IMAGE="$RUNNER_TEMP/ubuntu-workload-oci" FLEXVM_OPENRC_ALPINE_LAYOUT="$RUNNER_TEMP/openrc-alpine-oci" python3 -u scripts/e2e.py --shard "$1" ${2:+--split "$2"} --jobs "$jobs" --no-skips "$kvm" --image "$E2E_IMAGE" --image-cache "$RUNNER_TEMP/image-cache" --test-image "/var/lib/flexvm-test-image" --log-dir "$RUNNER_TEMP/e2e-logs"
      - name: Test image made
        id: test-image-made
        if: always() && steps.test-image-cache.outputs.cache-hit != 'true'
        run: if [ -e "/var/lib/flexvm-test-image/index.json" ]; then echo "made=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save test image
        if: always() && steps.test-image-made.outputs.made == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/flexvm-test-image
          key: ${{ steps.test-image-cache.outputs.cache-primary-key }}

      - name: Image digest
        id: img-digest
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/image-cache" 2>/dev/null || true
          for f in "$RUNNER_TEMP"/image-cache/oci/*/index.json; do
            [ -e "$f" ] && python3 -c 'import json, sys; print("digest=" + json.load(open(sys.argv[1]))["manifests"][0]["digest"].replace(":", "-"))' "$f" >> "$GITHUB_OUTPUT"
          done
          true
      - name: Save image
        if: always() && startsWith(matrix.shard, 'pr') && steps.img-digest.outputs.digest != '' && steps.img-cache.outputs.cache-matched-key != format('{0}{1}', steps.img.outputs.prefix, steps.img-digest.outputs.digest)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache/oci
          key: ${{ steps.img.outputs.prefix }}${{ steps.img-digest.outputs.digest }}

      - name: Collect logs
        if: failure() || cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/e2e-logs" || true
          sudo dmesg | tail -200 > "$RUNNER_TEMP/e2e-logs/dmesg.txt" || true
          # The background release build's output, also when "Build flexvm" never ran.
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/e2e-logs/build.log" || true

  # e2e's steps on the aarch64 runner, in one job. "Probe KVM" decides what it runs: with KVM, the pr shard
  # unsplit; without (GitHub's arm runners have none) everything else: the release build, the patched
  # Firecracker for aarch64-unknown-linux-musl (cached as e2e's is), the aarch64 artifacts fetched and
  # checked against their pins, the test image, and what needs no KVM (e2e.py --no-kvm).
  e2e-aarch64:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    name: end-to-end (aarch64, ${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [pr]
    steps: *e2e-steps
