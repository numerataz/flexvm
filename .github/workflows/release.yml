name: Release artifacts

# Pushing a semver tag (vMAJOR.MINOR.PATCH) builds the patched Firecracker and the source-pinned guest kernel, for
# x86_64 and aarch64 each natively on a runner of its own, as the release flexvm downloads from on first use
# (x86_64's assets are firecracker, vmlinux and inputs.txt; aarch64's end in -aarch64: asset in scripts/versions.sh).
# The tag must be ARTIFACTS_TAG in scripts/versions.sh at the tagged commit. Afterwards, scripts/pin-artifacts.sh
# pins the assets' sha256 in scripts/checksums.sha256 (a follow-up commit) once their build provenance (attested
# here) verifies: from then on, flexvm builds download them. A release's assets never change. This file is one of a
# release's inputs (scripts/pin-artifacts.sh --inputs hashes it): changing it needs a new ARTIFACTS_TAG. The steps:
# "Releasing the artifacts" in README.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The assets go from the build jobs to the publishing job on a draft of the release itself, not as workflow
  # artifacts: they are ~350 MB a release, and the organisation's shared artifact storage is 500 MB. This job
  # checks the tag and opens the draft; nobody outside the repository sees it until the last job publishes it.
  draft:
    name: draft ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must use vMAJOR.MINOR.PATCH, not $TAG"
            exit 1
          fi
          want=$(env -u ARTIFACTS_TAG bash -c 'source scripts/versions.sh; echo "$ARTIFACTS_TAG"')
          if [ "$TAG" != "$want" ]; then
            echo "::error::scripts/versions.sh at this commit names $want, not $TAG"
            exit 1
          fi

      # A published release's assets are never replaced. A draft is what an earlier, failed run of this tag left:
      # it is deleted (the tag stays) and this run starts from an empty one.
      - name: Open the draft
        run: |
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$state" != true ]; then
              echo "::error::release $TAG exists already; its assets are never replaced"
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "Building."

  build:
    name: build ${{ github.ref_name }} (${{ matrix.arch }})
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      # To add this architecture's assets to the draft. The token is given to that one step only: the build
      # scripts' step gets none.
      contents: write
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The recipe (hashed into inputs.txt, with this file: scripts/pin-artifacts.sh --inputs).
      - name: Build the assets
        run: ./scripts/release-assets.sh "$RUNNER_TEMP/state" "$RUNNER_TEMP/assets"

      # With SHA256SUMS-<arch>, which the publishing job checks the downloads against and then removes.
      - name: Add the assets to the draft
        run: gh release upload "$TAG" "$RUNNER_TEMP"/assets/*
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: attest and publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Only this job holds signing and publishing credentials; no build scripts run here.
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the draft's assets
        run: gh release download "$TAG" --dir "$RUNNER_TEMP/assets"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check the assets
        working-directory: ${{ runner.temp }}/assets
        run: |
          ls -l
          [ "$(LC_ALL=C ls | tr '\n' ' ')" = "SHA256SUMS-aarch64 SHA256SUMS-x86_64 firecracker firecracker-aarch64 inputs-aarch64.txt inputs.txt kernel-modules-aarch64.tar.gz kernel-modules.tar.gz kernel-sdk-aarch64.tar.gz kernel-sdk.tar.gz vmlinux vmlinux-aarch64 " ]
          sha256sum --check --strict SHA256SUMS-x86_64 SHA256SUMS-aarch64
          [ "$(cut -d' ' -f3 SHA256SUMS-x86_64 | sort | tr '\n' ' ')" = "firecracker inputs.txt kernel-modules.tar.gz kernel-sdk.tar.gz vmlinux " ]
          [ "$(cut -d' ' -f3 SHA256SUMS-aarch64 | sort | tr '\n' ' ')" = "firecracker-aarch64 inputs-aarch64.txt kernel-modules-aarch64.tar.gz kernel-sdk-aarch64.tar.gz vmlinux-aarch64 " ]
          cat SHA256SUMS-x86_64 SHA256SUMS-aarch64 > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/firecracker
            ${{ runner.temp }}/assets/vmlinux
            ${{ runner.temp }}/assets/inputs.txt
            ${{ runner.temp }}/assets/kernel-modules.tar.gz
            ${{ runner.temp }}/assets/kernel-sdk.tar.gz
            ${{ runner.temp }}/assets/firecracker-aarch64
            ${{ runner.temp }}/assets/vmlinux-aarch64
            ${{ runner.temp }}/assets/inputs-aarch64.txt
            ${{ runner.temp }}/assets/kernel-modules-aarch64.tar.gz
            ${{ runner.temp }}/assets/kernel-sdk-aarch64.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$RUNNER_TEMP/assets
          {
            echo "Prebuilt patched Firecracker ($(head -1 "$out/inputs.txt" | cut -d' ' -f2)) and guest kernel for flexvm, x86_64 and aarch64 (assets ending in -aarch64), built from ${GITHUB_SHA}."
            echo
            echo "Pin them with scripts/pin-artifacts.sh at a commit whose scripts/versions.sh names ${TAG}."
            echo
            echo '```'
            cat "$out/SHA256SUMS"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          # The draft holds the ten assets already; the per-architecture sums were only the hand-off's check.
          gh release upload "$TAG" "$out/SHA256SUMS"
          gh release delete-asset "$TAG" SHA256SUMS-x86_64 --yes
          gh release delete-asset "$TAG" SHA256SUMS-aarch64 --yes
          [ "$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join(" ")')" = "SHA256SUMS firecracker firecracker-aarch64 inputs-aarch64.txt inputs.txt kernel-modules-aarch64.tar.gz kernel-modules.tar.gz kernel-sdk-aarch64.tar.gz kernel-sdk.tar.gz vmlinux vmlinux-aarch64" ]
          gh release edit "$TAG" --draft=false --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
