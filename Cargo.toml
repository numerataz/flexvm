[workspace]
resolver = "2"
members = ["flexvm", "guest"]

[workspace.dependencies]
libc = "0.2"
bytes = "1"
yamux = "0.14"
futures-util = { version = "0.3", features = ["io", "sink"] }
tokio-util = { version = "0.7", features = ["compat", "codec"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
